[project]
name = "tele-resolver"
version = "0.0.0"
description = "Telegram bot service that connects users to the chatbot API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=21.0",
    "httpx>=0.27.0",
    "sqlmodel>=0.0.34",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "python-json-logger>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.1",
    "taskipy>=1.14.1",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.taskipy.tasks]
dev = "uv run python main.py"
test = "uv run pytest -v"
lint = "uv run ruff check ."
fix = "uv run ruff check --fix ."
format = "uv run ruff format ."
